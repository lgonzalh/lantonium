    <text x="64" y="140" font-size="42" letter-spacing="-1.7">Esquema de arquitectura · AppSistemaClientes</text>
    <text x="64" y="185" fill="#aaa8a1" font-size="23">Aplicación de escritorio · Java 22 · JavaFX 22 · Spring Boot 3.2.5</text>
    <path d="M64 224H1376" stroke="#44433e"/>
    <text x="64" y="273" fill="#aaa8a1" font-size="17" letter-spacing="2">01 / CAPAS Y PERSISTENCIA</text>

