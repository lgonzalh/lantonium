<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Esquema de arquitectura · AppSistemaClientes</title>
  <desc id="diagram-description">Diagrama basado en el código del proyecto; no es una captura de la aplicación. JavaFX y FXML se conectan con un servicio Spring, Spring Data JPA y MySQL. El servicio permite listar, buscar por identificador, guardar y eliminar clientes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#eeede8" stroke-width="1.7"/>
    </marker>
  </defs>
  <rect width="1440" height="1000" fill="#080808"/>
