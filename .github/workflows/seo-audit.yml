name: SEO Audit

on:
  push:
    branches:
      - main
      - developer
  pull_request:
    branches:
      - main
      - developer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SEO audit
        run: python scripts/seo_audit.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install verification dependencies
        run: npm ci --ignore-scripts

      - name: Check generated pages and site tests
        run: |
          npm run build
          git diff --exit-code
          npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify browser behavior
        run: npm run test:browser
